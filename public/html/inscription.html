<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPHessV2 - Inscription</title>
    <link href="../style/style.css" rel="stylesheet">
<body>
    <h1>GPHess</h1>
    <div id="center">
        <h2>Inscription</h2>
        <div><input id="identifiant" type="text" placeholder="Identifiant"></div>
        <div><input id="password" type="password" placeholder="Mot de passe"></div>
        <div><input id="confirmation" type="password" placeholder="Confirmez le mot de passe"></div>
        <ul>
            <li id="8char">8 caractères</li>
            <li id="1maj">1 majuscule</li>
            <li id="1min">1 minuscule</li>
            <li id="1chi">1 chiffre</li>
            <li id="1spe">1 caractère spécial</li>    
        </ul>
        <button id="submit" disabled>S'inscrire</button> <a href="connexion">Déjà un compte ?</a>
        <div><span id = error></span></div>
    </div>

    <script src="../script/inscription.js"></script>
</body>
</html>
